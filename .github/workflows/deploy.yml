# Deploys bmcloud-server with Ansible on a self-hosted runner that lives
# on the target server itself. Because the runner is on the same host,
# the playbook connects over a local connection (no SSH, no host keys).
#
# One-time server setup:
#   1. Install a GitHub self-hosted runner for this repository
#      (Settings → Actions → Runners → New self-hosted runner).
#   2. Passwordless sudo for the runner user (Ansible uses become):
#         sudo tee /etc/sudoers.d/github-runner \
#           <<< "$USER ALL=(ALL) NOPASSWD: ALL"
#         sudo visudo -c   # must say "parsed OK"
#   3. Repository secrets (Settings → Secrets and variables → Actions):
#         BMCLOUD_DOMAIN  e.g. bmcloud.ru
#         BMCLOUD_EMAIL   e-mail for Let's Encrypt notices
#
# The inventory is generated at run time from the secrets, so no host
# information is ever committed to git.

name: Deploy bmcloud

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run in parallel on the same server.
concurrency:
  group: deploy-bmcloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Ansible is installed
        run: |
          if ! command -v ansible-playbook >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ansible
          fi

      - name: Generate inventory (localhost connection, values from secrets)
        run: |
          cat > ansible/inventory.ini <<EOF
          # Generated by GitHub Actions — safe to commit? No, and it is git-ignored anyway.
          [bmcloud]
          localhost ansible_connection=local

          [bmcloud:vars]
          bmcloud_domain=${{ secrets.BMCLOUD_DOMAIN }}
          certbot_email=${{ secrets.BMCLOUD_EMAIL }}
          app_user=${USER}
          EOF

      - name: Deploy
        working-directory: ansible
        run: ansible-playbook deploy.yml
