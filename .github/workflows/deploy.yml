name: Deploy bmcloud

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run in parallel on the same server.
concurrency:
  group: deploy-bmcloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Ansible is installed
        run: |
          if ! command -v ansible-playbook >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ansible
          fi

      - name: Generate inventory (localhost connection, values from secrets)
        run: |
          cat > ansible/inventory.ini <<EOF
          # Generated by GitHub Actions — safe to commit? No, and it is git-ignored anyway.
          [bmcloud]
          localhost ansible_connection=local

          [bmcloud:vars]
          bmcloud_domain=bmcloud.ru
          certbot_email=makloun1994@gmail.com
          app_user=${USER}
          EOF

      - name: Deploy
        working-directory: ansible
        run: ansible-playbook deploy.yml
