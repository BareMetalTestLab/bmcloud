<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>bmcloud — my devices</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>bmcloud</h1>

    <section id="auth">
        <h2>Enter</h2>
        <p><input id="login" placeholder="login (only for registration)" size="30"></p>
        <p><input id="email" placeholder="email" size="30"></p>
        <p><input id="password" type="password" placeholder="password" size="30"></p>
        <p>
            <button id="login-btn">Enter</button>
            <button id="register-btn">Registration</button>
        </p>
        <p id="auth-msg"></p>
    </section>

    <section id="panel" hidden>
        <h2>My devices</h2>
        <p>
            <button id="logout-btn">Logout</button>
        </p>
        <p id="msg"></p>
        <table id="devices" hidden>
            <thead>
                <tr>
                    <th>id</th>
                    <th>name</th>
                    <th>state</th>
                    <th>updated at</th>
                </tr>
            </thead>
            <tbody id="devices-body"></tbody>
        </table>
    </section>
    <script src="app.js"></script>
</body>

</html>
