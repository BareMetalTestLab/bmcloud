<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>bmcloud</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>bmcloud</h1>

    <section id="auth">
        <h2>Enter</h2>
        <p><input id="email" placeholder="email" size="30"></p>
        <p><input id="password" type="password" placeholder="password" size="30"></p>
        <p>
            <button id="login-btn">Enter</button>
            <button id="register-btn">Registration</button>
        </p>
        <p id="auth-msg"></p>
    </section>

    <section id="panel" hidden>
        <h2>Devices</h2>
        <p>
            <button id="logout-btn">Logout</button>
        </p>
        <p>
            <input id="new-device-name" placeholder="new device name" size="30">
            <button id="add-device-btn">Add device</button>
        </p>
        <div id="new-token" hidden>
            <p>Token for <b id="new-token-name"></b> - shown only once, copy it now:</p>
            <p class="token-row">
                <code id="new-token-value"></code>
                <button id="copy-token-btn">Copy</button>
                <span id="copy-msg"></span>
            </p>
        </div>
        <p id="msg"></p>
        <table id="devices" hidden>
            <thead>
                <tr>
                    <th>id</th>
                    <th>name</th>
                    <th>state</th>
                    <th>updated at</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="devices-body"></tbody>
        </table>
    </section>

    <section id="jobs-panel" hidden>
        <h2>Jobs</h2>
        <p>
            <select id="flash-device"></select>
            <label class="file-btn">📁 Choose file<input type="file" id="firmware-file" class="visually-hidden"></label>
            <span id="firmware-file-name" class="file-name"></span>
            <button id="flash-btn">Flash</button>
        </p>
        <p id="jobs-msg"></p>
        <table id="jobs" hidden>
            <thead>
                <tr>
                    <th>id</th>
                    <th>device</th>
                    <th>firmware</th>
                    <th>status</th>
                    <th>error</th>
                </tr>
            </thead>
            <tbody id="jobs-body"></tbody>
        </table>
    </section>
    <script src="app.js"></script>
</body>

</html>
